seed: 42

dataset:
  root_dir: "C:/Users/javad/Desktop/Traffic-Vehicle-Classification/dataset"

split:
  val_size: 0.20
  test_size: 0.0

data:
  batch_size: 32
  image_size: [224, 224]
  num_workers: 0

training:
  epochs: 15


# ============================================================
# Default configuration
# Every experiment starts from these values.
# An experiment only overrides what it needs to change.
# ============================================================

defaults:

  model:
    name: deep_baseline
    dropout: 0.3
    pooling: max

  loss:
    name: cross_entropy

  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0

  scheduler:
    name: none

  augmentation:
    enabled: false
    horizontal_flip: false
    rotation: 0
    color_jitter: false
    random_crop: false


# ============================================================
# Experiments
# ============================================================

experiments:

  # ----------------------------------------------------------
  # 01 - No Augmentation
  # ----------------------------------------------------------

  - name: exp01_no_augmentation


  # ----------------------------------------------------------
  # 02 - Augmentation
  # ----------------------------------------------------------

  - name: exp02_augmentation

    augmentation:
      enabled: true
      horizontal_flip: true
      rotation: 15
      color_jitter: true
      random_crop: true


  # ----------------------------------------------------------
  # 03 - Dropout = 0
  # ----------------------------------------------------------

  - name: exp03_dropout_0

    model:
      dropout: 0.0


  # ----------------------------------------------------------
  # 04 - Dropout = 0.3
  # ----------------------------------------------------------

  - name: exp04_dropout_03

    model:
      dropout: 0.3


  # ----------------------------------------------------------
  # 05 - Dropout = 0.5
  # ----------------------------------------------------------

  - name: exp05_dropout_05

    model:
      dropout: 0.5


  # ----------------------------------------------------------
  # 06 - Max Pooling
  # ----------------------------------------------------------

  - name: exp06_max_pooling

    model:
      pooling: max


  # ----------------------------------------------------------
  # 07 - Average Pooling
  # ----------------------------------------------------------

  - name: exp07_average_pooling

    model:
      pooling: avg


  # ----------------------------------------------------------
  # 08 - Weight Decay = 0
  # ----------------------------------------------------------

  - name: exp08_weight_decay_0

    optimizer:
      weight_decay: 0.0


  # ----------------------------------------------------------
  # 09 - Weight Decay = 1e-4
  # ----------------------------------------------------------

  - name: exp09_weight_decay_1e4

    optimizer:
      weight_decay: 0.0001


  # ----------------------------------------------------------
  # 10 - Constant Learning Rate
  # ----------------------------------------------------------

  - name: exp10_constant_lr

    optimizer:
      lr: 0.001

    scheduler:
      name: none


  # ----------------------------------------------------------
  # 11 - StepLR
  # ----------------------------------------------------------

  - name: exp11_step_lr

    optimizer:
      lr: 0.001

    scheduler:
      name: step_lr
      step_size: 5
      gamma: 0.5


  # ----------------------------------------------------------
  # 12 - ReduceLROnPlateau
  # ----------------------------------------------------------

  - name: exp12_reduce_on_plateau

    optimizer:
      lr: 0.001

    scheduler:
      name: reduce_on_plateau
      patience: 2
      factor: 0.5