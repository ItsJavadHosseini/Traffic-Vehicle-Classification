[project]
name = "traffic-vehicle-classification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ItsJavadHosseini", email = "javadhossiniytr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scikit-learn",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
traffic-vehicle-classification = "traffic_vehicle_classification:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
notebook = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
