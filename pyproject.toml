[project]
name = "traffic-vehicle-classification"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ItsJavadHosseini", email = "javadhossiniytr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imagehash",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-learn",
    "streamlit>=1.65.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["data", "models", "training"]

[dependency-groups]
dev = [
    "notebook>=7.6.2",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
